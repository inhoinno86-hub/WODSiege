name: wodsiege-pilot

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      WODSIEGE_DATA_DIR: /var/lib/wodsiege
      WODSIEGE_PUBLIC_ORIGIN: ${WODSIEGE_PUBLIC_ORIGIN:?Set the HTTPS public origin}
      WODSIEGE_ALLOWED_ORIGINS: ${WODSIEGE_ALLOWED_ORIGINS:-}
      WODSIEGE_OPERATOR_EMAIL_FILE: /run/secrets/operator_email
      WODSIEGE_OPERATOR_PASSWORD_FILE: /run/secrets/operator_password
    expose:
      - "8787"
    volumes:
      - wodsiege_data:/var/lib/wodsiege
    secrets:
      - operator_email
      - operator_password
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      WODSIEGE_ACME_EMAIL: ${WODSIEGE_ACME_EMAIL:?Set the ACME contact email}
      WODSIEGE_SITE_ADDRESS: ${WODSIEGE_SITE_ADDRESS:?Set the public site address}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - edge
      - private

networks:
  edge:
  private:
    internal: true

volumes:
  wodsiege_data:
  caddy_data:
  caddy_config:

secrets:
  operator_email:
    file: ${WODSIEGE_OPERATOR_EMAIL_SECRET_FILE:?Set an absolute path outside the repository}
  operator_password:
    file: ${WODSIEGE_OPERATOR_PASSWORD_SECRET_FILE:?Set an absolute path outside the repository}
